services:
  postgres:
    image: postgres:17-alpine
    container_name: ylume-ops-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  ylume-ops:
    container_name: ylume-ops

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./database:/app/database

    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      YLUME_OPS_ACCESS_PASSWORD: ${YLUME_OPS_ACCESS_PASSWORD}
      YLUME_OPS_SESSION_SECRET: ${YLUME_OPS_SESSION_SECRET}
      YLUME_OPS_COOKIE_SECURE: ${YLUME_OPS_COOKIE_SECURE:-true}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: