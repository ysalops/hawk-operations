<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hawk Operations | Acesso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #1d2733 0%,
                    #10161d 45%,
                    #090d12 100%
                );
            color: #ffffff;
        }

        .login-card {
            width: min(390px, calc(100% - 32px));
            padding: 42px 38px;
            background: rgba(18, 25, 33, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .brand {
            margin-bottom: 34px;
            text-align: center;
        }

        .brand-mark {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: #ffffff;
            color: #111820;
            font-size: 24px;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.08em;
        }

        .brand p {
            margin: 8px 0 0;
            color: #8f9cab;
            font-size: 13px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bcc6d1;
            font-size: 13px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: 1px solid #303b47;
            border-radius: 10px;
            outline: none;
            background: #0e141b;
            color: white;
            font-size: 15px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #7b8794;
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 18px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            background: #ffffff;
            color: #10161d;
            font-weight: 700;
            font-size: 14px;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: #e7ebef;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        .error {
            min-height: 20px;
            margin-top: 14px;
            color: #ff8d8d;
            text-align: center;
            font-size: 13px;
        }

        .footer {
            margin-top: 28px;
            color: #66727e;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.04em;
        }
    </style>
</head>

<body>
    <main class="login-card">

        <div class="brand">
            <div class="brand-mark">H</div>

            <h1>HAWK OPERATIONS</h1>

            <p>
                Gestão operacional de frota
            </p>
        </div>

        <form id="login-form">

            <label for="password">
                Senha de acesso
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                autofocus
                required
            >

            <button
                id="login-button"
                type="submit"
            >
                ENTRAR
            </button>

            <div
                id="error-message"
                class="error"
            ></div>

        </form>

        <div class="footer">
            ACESSO RESTRITO · HAWK TRANSPORTES
        </div>

    </main>

    <script>
        const form =
            document.getElementById("login-form");

        const password =
            document.getElementById("password");

        const button =
            document.getElementById("login-button");

        const errorMessage =
            document.getElementById("error-message");

        form.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                errorMessage.textContent = "";
                button.disabled = true;
                button.textContent = "ENTRANDO...";

                try {
                    const response = await fetch(
                        "/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                            },

                            body: JSON.stringify({
                                password:
                                    password.value,
                            }),
                        },
                    );

                    if (!response.ok) {
                        throw new Error();
                    }

                    window.location.href = "/";

                } catch {
                    errorMessage.textContent =
                        "Senha inválida. Tente novamente.";

                    password.select();

                } finally {
                    button.disabled = false;
                    button.textContent = "ENTRAR";
                }
            },
        );
    </script>
</body>
</html>
