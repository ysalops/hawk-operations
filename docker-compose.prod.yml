services:
  postgres:
    image: postgres:17-alpine
    container_name: ylume-ops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ylume_ops}
      POSTGRES_USER: ${POSTGRES_USER:-ylume_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ylume_ops} -d ${POSTGRES_DB:-ylume_ops}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ylume-ops:
    container_name: ylume-ops
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ylume_ops}
      POSTGRES_USER: ${POSTGRES_USER:-ylume_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      YLUME_OPS_ACCESS_PASSWORD: ${YLUME_OPS_ACCESS_PASSWORD}
      YLUME_OPS_SESSION_SECRET: ${YLUME_OPS_SESSION_SECRET}
      YLUME_OPS_COOKIE_SECURE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YLUME_OPS_AI_MODEL: ${YLUME_OPS_AI_MODEL:-gpt-5.6-luna}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
